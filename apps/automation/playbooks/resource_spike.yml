---
# Resource Spike Response Playbook
# Identify and mitigate CPU/RAM/Disk spikes

- name: Resource Spike Response
  hosts: "{{ target_host | default('localhost') }}"
  gather_facts: true
  vars:
    callback_url: "{{ callback | default('http://localhost:8000/automation/callback') }}"
    action_id: "{{ action_id | default('unknown') }}"
    resource_type: "{{ type | default('cpu') }}"

  tasks:
    - name: Report start
      uri:
        url: "{{ callback_url }}"
        method: POST
        body_format: json
        body:
          action_id: "{{ action_id }}"
          status: "running"
          message: "Investigating {{ resource_type }} spike"
      ignore_errors: true

    # 1. Identify resource type and current levels
    - name: Get CPU usage
      shell: "top -bn1 | grep 'Cpu(s)' | awk '{print $2}' | cut -d'%' -f1"
      register: cpu_usage
      ignore_errors: true
      changed_when: false

    - name: Get memory usage percentage
      shell: "free | grep Mem | awk '{printf(\"%.1f\", $3/$2 * 100.0)}'"
      register: mem_usage
      ignore_errors: true
      changed_when: false

    - name: Get disk usage
      shell: "df -h / | tail -1 | awk '{print $5}' | cut -d'%' -f1"
      register: disk_usage
      ignore_errors: true
      changed_when: false

    - name: Current resource levels
      debug:
        msg: "CPU: {{ cpu_usage.stdout }}%, Memory: {{ mem_usage.stdout }}%, Disk: {{ disk_usage.stdout }}%"

    # 2. List top consuming processes
    - name: Top 10 CPU processes
      shell: "ps aux --sort=-%cpu | head -11 | tail -10"
      register: top_cpu_processes
      ignore_errors: true
      changed_when: false
      when: resource_type in ['cpu', 'all']

    - name: Top 10 memory processes
      shell: "ps aux --sort=-%mem | head -11 | tail -10"
      register: top_mem_processes
      ignore_errors: true
      changed_when: false
      when: resource_type in ['memory', 'ram', 'all']

    - name: Top CPU consumers
      debug:
        msg: "{{ top_cpu_processes.stdout_lines }}"
      when: resource_type in ['cpu', 'all']

    # 3. Check for runaway processes
    - name: Identify processes using >90% CPU
      shell: "ps aux --sort=-%cpu | awk '$3 > 90 {print $2, $11}' | head -5"
      register: runaway_cpu
      ignore_errors: true
      changed_when: false

    - name: Identify processes using >80% memory
      shell: "ps aux --sort=-%mem | awk '$4 > 80 {print $2, $11}' | head -5"
      register: runaway_mem
      ignore_errors: true
      changed_when: false

    - name: Runaway processes detected
      debug:
        msg: "CPU hogs: {{ runaway_cpu.stdout_lines }}, Memory hogs: {{ runaway_mem.stdout_lines }}"

    # 4. Disk space analysis (if disk spike)
    - name: Find largest files
      shell: "du -ah /home /var/log /tmp 2>/dev/null | sort -rh | head -10"
      register: largest_files
      ignore_errors: true
      changed_when: false
      when: resource_type in ['disk', 'all']

    - name: Check log file sizes
      shell: "du -sh /var/log/* 2>/dev/null | sort -rh | head -5"
      register: log_sizes
      ignore_errors: true
      changed_when: false
      when: resource_type in ['disk', 'all']

    # 5. Suggest cleanup actions
    - name: Check for old log files
      shell: "find /var/log -name '*.log' -mtime +30 -size +100M 2>/dev/null | head -5"
      register: old_logs
      ignore_errors: true
      changed_when: false
      when: resource_type in ['disk', 'all']

    - name: Check tmp directory
      shell: "du -sh /tmp/* 2>/dev/null | sort -rh | head -5"
      register: tmp_usage
      ignore_errors: true
      changed_when: false
      when: resource_type in ['disk', 'all']

    # 6. Cleanup suggestions (requires approval to execute)
    - name: Build cleanup recommendations
      set_fact:
        cleanup_suggestions:
          old_logs_for_cleanup: "{{ old_logs.stdout_lines if resource_type in ['disk', 'all'] else [] }}"
          large_tmp_files: "{{ tmp_usage.stdout_lines[:3] if resource_type in ['disk', 'all'] else [] }}"
          runaway_cpu_processes: "{{ runaway_cpu.stdout_lines }}"
          runaway_mem_processes: "{{ runaway_mem.stdout_lines }}"

    # 7. Report findings
    - name: Compile resource spike report
      set_fact:
        spike_report:
          resource_type: "{{ resource_type }}"
          cpu_usage: "{{ cpu_usage.stdout }}%"
          memory_usage: "{{ mem_usage.stdout }}%"
          disk_usage: "{{ disk_usage.stdout }}%"
          top_cpu_processes: "{{ top_cpu_processes.stdout_lines[:5] if resource_type in ['cpu', 'all'] else [] }}"
          top_memory_processes: "{{ top_mem_processes.stdout_lines[:5] if resource_type in ['memory', 'ram', 'all'] else [] }}"
          largest_files: "{{ largest_files.stdout_lines[:5] if resource_type in ['disk', 'all'] else [] }}"
          cleanup_recommendations: "{{ cleanup_suggestions }}"
          action_required: "{{ 'Process termination recommended' if (runaway_cpu.stdout_lines | length > 0 or runaway_mem.stdout_lines | length > 0) else 'Monitor resource usage' }}"

    - name: Report results
      uri:
        url: "{{ callback_url }}"
        method: POST
        body_format: json
        body:
          action_id: "{{ action_id }}"
          status: "completed"
          success: true
          message: "Resource spike investigation completed"
          details: "{{ spike_report }}"
      ignore_errors: true
